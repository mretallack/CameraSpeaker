name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: black --check camera_speaker/ tests/
      - run: isort --check-only camera_speaker/ tests/
      - run: flake8 camera_speaker/ tests/
      - run: pytest tests/ -v
