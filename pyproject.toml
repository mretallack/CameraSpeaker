[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-speaker"
version = "0.1.0"
description = "Send audio to thingino IP cameras for playback"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["paramiko>=3.4.0,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<9", "black>=24.0.0,<25", "isort>=5.13.0,<6", "flake8>=7.0.0,<8"]

[project.scripts]
camera-speaker = "camera_speaker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203"]
