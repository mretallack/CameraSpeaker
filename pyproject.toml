[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-speaker"
version = "0.1.0"
description = "Send audio to thingino IP cameras for playback"
requires-python = ">=3.13"
dependencies = ["paramiko>=3.4.0,<4"]

[project.scripts]
camera-speaker = "camera_speaker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
